[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twitterdata"
version = "0.1.0"
description = "Safe parsing of X thread captures into a standard reply table"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
twitterdata = "twitterdata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "sampling"]
pythonpath = ["src"]

[tool.setuptools.package-data]
twitterdata = ["capture/*.html"]
