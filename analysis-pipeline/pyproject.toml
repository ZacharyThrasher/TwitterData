[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replyanalysis"
version = "0.1.0"
description = "Pre-registered reply ranking and exposure analysis on reply tables (schema v1)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.2", "scipy>=1.10", "statsmodels>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
replyanalysis = "replyanalysis.cli:main"

[tool.setuptools.packages.find]
include = ["replyanalysis*"]

[tool.setuptools.package-data]
replyanalysis = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
